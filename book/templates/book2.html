<!DOCTYPE html>
<html lang="{{LANG}}" dir="{{DIR}}" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{BOOK_NAME_ATTR}}">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#5A1030" id="themeColor">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="format-detection" content="telephone=no">
<!--
  ════════════════════════════════════════════════════════════════════
  {{LICENSE_HEADER}}
  ════════════════════════════════════════════════════════════════════
-->
<title>{{BOOK_NAME}}</title>
{{MANIFEST_LINK}}
<link rel="icon" href="{{ICON_DATA}}">
<link rel="apple-touch-icon" href="{{ICON_PNG}}">
<script>(function(){var d=document.documentElement;try{var t=localStorage.getItem('gh2.theme')||((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'night':'day');d.setAttribute('data-theme',t);var z=localStorage.getItem('gh2.zoom');if(z)document.documentElement.style.setProperty('--z',z)}catch(e){}})()</script>
<style>
{{FONT_FACES}}
/* ═════ رموز التصميم — هوية غيداء: عاجي + برقوقي + ذهب شمباني. «نهاري» افتراضي، و«ليلي» برقوقي عميق (تلقائي مع الجوال أو يدوي) ═════ */
:root{
  --z:1;
  --bg:#FBF5F1;--bg2:#F6ECE7;--paper:#FFFFFF;--paper2:#FFFDFB;--ink:#2B1720;--ink2:#4A3039;--muted:#76606A;--dim:#9C8790;
  --line:rgba(90,16,48,.10);--line2:rgba(90,16,48,.20);
  --plum:#5A1030;--plum2:#3A0A1F;--rose:#A3154F;
  --gold:#A9823F;--gold-hi:#8A6527;--gold-deep:#C9A86A;--gold-grad:linear-gradient(135deg,#F3E2BD 0%,#D9BB81 55%,#B8924E 100%);--on-gold:#3A0A1F;
  --accent:#A3154F;--accent-bg:#FBEAF0;--tile-ic:linear-gradient(145deg,#7A1844,#3A0A1F);--tile-ic-fg:#EBD3A0;
  --cta:#5A1030;--on-cta:#FFF6EC;
  --danger:#B3261E;--danger-bg:#FDEDEB;--danger-line:rgba(179,38,30,.22);--danger-solid:#B3261E;
  --warn:#7A4A00;--warn-bg:#FFF4DC;--ok:#1E7A46;--ok-bg:#E7F4EC;
  --sh1:0 1px 2px rgba(90,16,48,.05),0 6px 18px -10px rgba(90,16,48,.18);--sh2:0 22px 50px -22px rgba(58,10,31,.45);
  --r1:10px;--r2:16px;--r3:22px;
  --fL:{{FONT_STACK}};--fA:'Naskh','Geeza Pro','Segoe UI',Tahoma,sans-serif;--fH:'AmiriB','Naskh','Geeza Pro',serif;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  --fs:calc(17px * var(--z));
}
[data-theme=night]{
  --bg:#150A10;--bg2:#1B0D14;--paper:#21111A;--paper2:#28141F;--ink:#F5E9EE;--ink2:#E0CDD5;--muted:#B49BA7;--dim:#8D7480;
  --line:rgba(233,211,166,.10);--line2:rgba(233,211,166,.22);
  --gold:#E2C68E;--gold-hi:#EBD3A0;--gold-deep:#B8924E;--on-gold:#2B0716;
  --accent:#F08DB4;--accent-bg:rgba(240,141,180,.10);--tile-ic:linear-gradient(145deg,#6E1640,#3A0A1F);--tile-ic-fg:#EBD3A0;
  --cta:#E2C68E;--on-cta:#2B0716;
  --danger:#FF8A80;--danger-bg:rgba(255,138,128,.09);--danger-line:rgba(255,138,128,.3);--danger-solid:#B3261E;
  --warn:#F2C26B;--warn-bg:rgba(242,194,107,.09);--ok:#7FD3A4;--ok-bg:rgba(127,211,164,.1);
  --sh1:0 1px 0 rgba(255,255,255,.02) inset,0 8px 22px -14px rgba(0,0,0,.8);--sh2:0 24px 60px -24px rgba(0,0,0,.9);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
html,body{margin:0;color:var(--ink);font-family:var(--fL);font-size:var(--fs);line-height:1.8}
body{min-height:100vh;min-height:100svh;overscroll-behavior-y:none;background:var(--bg);-webkit-font-smoothing:antialiased;transition:background-color .3s,color .3s}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
a{color:inherit}
.ar,[lang=ar]{font-family:var(--fA);direction:rtl;text-align:right;unicode-bidi:isolate}
.L{font-family:var(--fL);direction:{{DIR}};unicode-bidi:isolate}
.hidden{display:none!important}
.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
.emb{fill:none;stroke:currentColor;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round;display:block}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ═════ الغلاف ═════ */
#cover{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 85% at 50% 0%,#8A1A4A 0%,#5A1030 42%,#2B0716 100%);color:#F1E2C4;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + var(--safe-t)) 22px calc(24px + var(--safe-b));text-align:center;transition:opacity .45s,transform .45s}
#cover.gone{opacity:0;transform:scale(1.03);pointer-events:none}
.frame{position:relative;width:100%;max-width:400px;border:1px solid rgba(233,211,166,.6);border-radius:24px;padding:36px 22px 28px;background:linear-gradient(180deg,rgba(255,255,255,.04),transparent 40%)}
.frame:before{content:"";position:absolute;inset:7px;border:1px solid rgba(233,211,166,.25);border-radius:18px;pointer-events:none}
.crest{width:92px;height:92px;margin:0 auto 18px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#5A1030;background:linear-gradient(145deg,#F7E7C3,#D2AE6C);box-shadow:0 14px 34px -10px rgba(0,0,0,.55),0 0 0 6px rgba(233,211,166,.14)}
.crest .emb{width:54px;height:54px}
.made{font-size:13px;letter-spacing:.04em;color:#E9D3A6;opacity:.9}
.bname{font-family:var(--fH);font-size:calc(36px * var(--z));line-height:1.3;margin:8px 0 2px;font-weight:700;color:#FFFFFF;text-shadow:0 2px 16px rgba(0,0,0,.25)}
.orn{display:flex;align-items:center;gap:10px;justify-content:center;margin:12px 0 16px;color:#E2C68E}
.orn i{display:block;height:1px;width:64px;background:linear-gradient(90deg,transparent,#E2C68E)}
.orn i:last-child{transform:scaleX(-1)}
.orn .i{width:14px;height:14px;stroke-width:1.4}
.hello{font-size:calc(21px * var(--z));color:#FFFFFF;margin:2px 0;font-weight:600}
.hello-sub{font-size:15px;color:#F1E2C4;margin:4px 0 0}
.cover-ar{font-size:14px;color:#E9D3A6;opacity:.8;margin-top:8px}
.cta{margin-top:28px;width:100%;max-width:340px;min-height:58px;border-radius:999px;background:linear-gradient(180deg,#F5E6C4,#D9BB81);color:#3A0A1F;font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 12px 30px -10px rgba(0,0,0,.45)}
.cta:active{transform:translateY(1px)}
.cta .i{width:20px;height:20px}
.ghostbtn{margin-top:12px;display:inline-flex;gap:8px;align-items:center;justify-content:center;border:1px solid rgba(233,211,166,.5);color:#F1E2C4;border-radius:999px;padding:0 18px;min-height:46px;font-size:15px}
.ghostbtn .i{width:18px;height:18px}
.ghostbtn.sos{border-color:rgba(255,180,180,.6);color:#FFD6D6}
.wm{margin-top:18px;font-size:11px;color:#E9D3A6;opacity:.6;line-height:1.6}

/* ═════ قفل الرمز ═════ */
#lock{position:fixed;inset:0;z-index:60;background:radial-gradient(120% 85% at 50% 0%,#7A1844,#3A0A1F 60%,#22050F);color:#F1E2C4;display:flex;align-items:center;justify-content:center;padding:24px}
.lockbox{width:100%;max-width:380px;text-align:center}
.lockbox h2{color:#FFFFFF;margin:6px 0 4px;font-size:22px;font-weight:700}
.codein{width:100%;height:64px;margin:20px 0 10px;border-radius:16px;border:2px solid #D9BB81;background:#FFFFFF;color:#3A0A1F;font:700 26px/1 ui-monospace,Menlo,Consolas,monospace;text-align:center;letter-spacing:.28em;direction:ltr;text-transform:uppercase}
.codein:focus{outline:0;border-color:#F3E2BD;box-shadow:0 0 0 4px rgba(233,211,166,.3)}
.err{color:#FFC4C4;min-height:24px;font-size:15px}

/* ═════ الشريط العلوي ═════ */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.3) blur(12px);backdrop-filter:saturate(1.3) blur(12px);border-bottom:1px solid var(--line);padding:calc(8px + var(--safe-t)) 12px 8px;display:flex;align-items:center;gap:10px}
@supports not (background:color-mix(in srgb,red,blue)){.top{background:var(--bg)}}
.top .ttl{flex:1;min-width:0}
.top .t1{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.top .t2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--tile-ic-fg);background:var(--tile-ic)}
.iconbtn .emb{width:26px;height:26px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex:none}
.seg button{min-height:40px;min-width:42px;padding:0 10px;border-radius:999px;font-size:13px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--cta);color:var(--on-cta)}
main{max-width:720px;margin:0 auto;padding:14px 14px calc(92px + var(--safe-b))}
.view{display:none;animation:fade .28s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ═════ الرئيسية ═════ */
.hero{position:relative;overflow:hidden;border-radius:var(--r3);padding:20px;margin-bottom:12px;background:radial-gradient(120% 120% at 100% 0%,#8A1A4A 0%,#5A1030 50%,#3A0A1F 100%);color:#F1E2C4;box-shadow:var(--sh2)}
.hero:after{content:"";position:absolute;inset:6px;border:1px solid rgba(233,211,166,.3);border-radius:17px;pointer-events:none}
.hero .hn{font-size:calc(23px * var(--z));color:#FFFFFF;font-weight:700;margin:0;line-height:1.4}
.hero .hs{font-size:13.5px;color:#E9D3A6;margin-top:2px}
.ring{display:flex;align-items:center;gap:14px;margin-top:14px}
.ring svg{flex:none}
.ring .pv{font-size:13px;color:#F1E2C4;line-height:1.6}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:var(--r2);padding:16px 14px;box-shadow:var(--sh1);min-height:118px;display:flex;flex-direction:column;gap:3px;text-align:start;position:relative;transition:border-color .2s,transform .15s}
.tile:active{transform:scale(.985);border-color:var(--line2)}
.ib{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:var(--tile-ic-fg);background:var(--tile-ic);box-shadow:inset 0 0 0 1px rgba(233,211,166,.25),0 6px 14px -8px rgba(58,10,31,.6);margin-bottom:8px;flex:none}
.ib .i{width:22px;height:22px;stroke-width:1.5}
.tile .tt{font-weight:700;font-size:calc(16px * var(--z));line-height:1.35}
.tile .ts{font-size:12.5px;color:var(--muted);line-height:1.5}
.tile.sos{border-color:var(--danger-line);background:var(--danger-bg)} .tile.sos .ib{color:#fff;background:var(--danger-solid);box-shadow:none} .tile.sos .tt{color:var(--danger)}
.tile.wide{grid-column:1/-1;min-height:auto;flex-direction:row;align-items:center;gap:14px}
.tile.wide .ib{margin:0}
.tile.madam{border-color:var(--line2);background:linear-gradient(135deg,var(--paper2),var(--paper))}
.h2{font-size:14px;color:var(--gold);margin:22px 4px 10px;font-weight:700;letter-spacing:.01em}

/* ═════ قائمة الفصول ═════ */
.chlist{display:flex;flex-direction:column;gap:8px}
.chrow{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r2);padding:12px;box-shadow:var(--sh1);text-align:start;width:100%}
.chrow .ib{margin:0;width:48px;height:48px}
.chrow .tx{flex:1;min-width:0}
.chrow .tt{font-weight:700;font-size:calc(15.5px * var(--z));line-height:1.4;display:block}
.chrow .ts{font-size:12.5px;color:var(--muted);display:block}
.chrow .bar{height:3px;background:var(--line);border-radius:9px;margin-top:8px;overflow:hidden;display:block}
.chrow .bar i{display:block;height:100%;background:var(--gold-grad);border-radius:9px}
.chrow .num{font:700 15px/1 var(--fH);color:var(--gold);flex:none;min-width:22px;text-align:center}

/* ═════ الفصل ═════ */
.chead{position:relative;background:var(--paper);border:1px solid var(--line2);border-radius:var(--r3);padding:18px;box-shadow:var(--sh1);margin-bottom:12px;display:flex;gap:14px;align-items:center;overflow:hidden}
.chead:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--gold-grad)}
.chead .ib{width:54px;height:54px;margin:0}
.chead .ib .i{width:26px;height:26px}
.chead h2{margin:0;font-size:calc(20px * var(--z));line-height:1.4;color:var(--ink);font-weight:700}
.chead .sub{color:var(--muted);font-size:13.5px}
.sec{background:var(--paper);border:1px solid var(--line);border-radius:var(--r2);padding:14px;box-shadow:var(--sh1);margin-bottom:10px}
.sec h3{margin:0 0 6px;font-size:calc(16.5px * var(--z));color:var(--rose);display:flex;align-items:center;gap:8px;line-height:1.45;font-weight:700}
[data-theme=night] .sec h3{color:var(--gold)}
.sec h3 .x{flex:1}
.sec h3 .b{display:block;font-weight:400;color:var(--muted);font-size:13.5px}
.para{display:flex;gap:10px;align-items:flex-start}
.para .x{flex:1}
.it{display:flex;gap:12px;align-items:flex-start;padding:12px 6px;margin:0;position:relative}
.it+.it{border-top:1px solid var(--line)}
.it .ic{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--plum);background:var(--accent-bg);border-radius:10px;margin-top:2px}
[data-theme=night] .it .ic{color:var(--gold)}
.it .ic .i{width:22px;height:22px;stroke-width:1.5}
.it .x{flex:1;min-width:0}
.a{font-weight:600;font-size:calc(17px * var(--z));line-height:1.75;color:var(--ink)}
.b{color:var(--muted);font-size:calc(14.5px * var(--z));margin-top:2px;line-height:1.7}
.why{font-size:calc(13.5px * var(--z));color:var(--muted);margin-top:6px;padding-inline-start:10px;border-inline-start:2px solid var(--gold-deep)}
.lvl{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 9px;margin-bottom:4px;border:1px solid}
.lvl .i{width:12px;height:12px;stroke-width:2.4}
.it.danger{background:var(--danger-bg);border-radius:12px;border-inline-start:3px solid var(--danger);padding-inline-start:10px;margin:4px 0} .it.danger+.it{border-top:0}
.it.danger .a{color:var(--danger)} .it.danger .ic{color:var(--danger)} .it.danger .lvl{color:var(--danger);border-color:var(--danger-line)}
.it.warn{background:var(--warn-bg);border-radius:12px;padding-inline-start:10px;margin:4px 0} .it.warn .a{color:var(--warn)} .it.warn .ic{color:var(--warn)} .it.warn .lvl{color:var(--warn);border-color:currentColor}
.step .ic{border:1px solid var(--line2);border-radius:50%;width:32px;height:32px;font:700 15px/1 var(--fH);color:var(--gold)}
.chk{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line2);flex:none;display:flex;align-items:center;justify-content:center;color:transparent;margin-top:2px;transition:.15s}
.chk .i{width:20px;height:20px;stroke-width:2.4}
.chk.on{background:var(--ok);border-color:transparent;color:#fff}
.pb{display:flex;flex-direction:column;gap:6px;flex:none}
.play{min-width:46px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:2px;padding:0 6px;font-weight:700;font-size:10.5px;letter-spacing:.02em;background:var(--rose);color:#fff;box-shadow:0 6px 14px -8px rgba(163,21,79,.7);transition:transform .15s}
[data-theme=night] .play{background:var(--gold-grad);color:var(--on-gold);box-shadow:none}
.play:active{transform:scale(.95)}
.play.ar{background:var(--plum);color:#F3E2BD;box-shadow:none}
[data-theme=night] .play.ar{background:transparent;color:var(--gold);border:1px solid var(--line2)}
.play .i{width:16px;height:16px;stroke-width:0;fill:currentColor}
.play .lb{display:block;line-height:1}
.play.on{background:var(--ok);color:#06140c;border-color:transparent;animation:pulse 1.1s ease-in-out infinite}
.play.na{opacity:.22;pointer-events:none}
@keyframes pulse{50%{transform:scale(1.06)}}
.call{display:flex;align-items:center;gap:10px;background:var(--danger-solid);color:#fff;text-decoration:none;border-radius:14px;padding:12px 14px;font-weight:700;font-size:19px;margin:8px 0 2px}
.call .i{width:20px;height:20px}
.donecard{border:1px solid var(--line2);border-radius:var(--r2);padding:18px;text-align:center;margin:14px 0;background:radial-gradient(100% 120% at 50% 0%,var(--accent-bg),transparent 70%)}
.donecard .ib{margin:0 auto 10px;width:52px;height:52px}
.nav2{display:flex;gap:8px;margin-top:8px}
.nav2 button{flex:1;min-height:52px;border-radius:14px;border:1px solid var(--line2);font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px}
.nav2 button .i{width:18px;height:18px}
.nav2 button.pri{background:var(--cta);color:var(--on-cta);border-color:transparent}
.wmline{margin:18px 4px 4px;text-align:center;font-size:11px;color:var(--dim)}

/* ═════ يومي ═════ */
.sched{background:var(--paper);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--sh1);padding:4px 14px}
.srow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border:0}
.srow .tm{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:78px;direction:ltr;font:700 16px/1.25 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;color:var(--ink)}
.srow .tm .i{width:16px;height:16px;color:var(--gold-deep)}
.srow .tm small{font-size:13px;color:var(--muted);font-weight:600}
.srow .x{flex:1}
.srow.rest .tm{color:var(--ok)} .srow.rest .tm .i{color:var(--ok)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 10px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r2);padding:14px;text-align:center}
.stat b{display:block;font:700 30px/1.15 var(--fH);color:var(--plum)}
[data-theme=night] .stat b{color:var(--gold)}
.stat span{font-size:12.5px;color:var(--muted)}
.rest-day{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--ok-bg);color:var(--ok);border:1px solid rgba(115,201,154,.25);border-radius:var(--r2);padding:14px;text-align:center;font-weight:700;margin-top:10px}

/* ═════ الردود / قولي لعاملتك ═════ */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rbtn{background:var(--paper);border:1px solid var(--line);border-radius:var(--r2);padding:12px;box-shadow:var(--sh1);text-align:start;display:flex;flex-direction:column;gap:4px;min-height:100px;transition:border-color .2s,background .2s}
.rbtn .ic{color:var(--gold);margin-bottom:2px}
.rbtn .ic .i{width:22px;height:22px;stroke-width:1.5}
.rbtn .a{font-size:calc(15px * var(--z));line-height:1.5}
.rbtn .b{font-size:12.5px}
.rbtn.on{border-color:var(--ok);background:var(--ok-bg)}
.rbtn.danger{border-color:var(--danger-line);background:var(--danger-bg)} .rbtn.danger .a,.rbtn.danger .ic{color:var(--danger)}
.speak{position:fixed;left:12px;right:12px;bottom:calc(84px + var(--safe-b));z-index:30;background:#5A1030;color:#FFFFFF;border:1px solid rgba(233,211,166,.5);border-radius:var(--r2);padding:16px;box-shadow:var(--sh2);font-size:calc(22px * var(--z));text-align:center;pointer-events:none;opacity:0;visibility:hidden;transform:translateY(16px);transition:opacity .2s,transform .2s,visibility .2s}
.speak.on{opacity:1;visibility:visible;transform:none}
.hint{border:1px solid var(--line);background:var(--accent-bg);border-radius:var(--r2);padding:12px 14px;margin-bottom:10px;display:flex;gap:10px;align-items:center;font-size:14.5px}
.hint>.i{color:var(--gold)}
.hint .x{flex:1}

/* ═════ الطوارئ ═════ */
.sosbig{display:flex;align-items:center;gap:12px;background:var(--danger-solid);color:#fff;text-decoration:none;border-radius:var(--r2);padding:16px;margin-bottom:8px;box-shadow:0 12px 26px -14px rgba(180,56,43,.8)}
.sosbig .n{font:700 32px/1 ui-monospace,SFMono-Regular,Menlo,monospace;min-width:92px;text-align:center;direction:ltr;display:flex;align-items:center;justify-content:center}
.sosbig .n .i{width:30px;height:30px}
.sosbig.alt{background:#5A1030;color:#fff} .sosbig.alt .n{color:#F3E2BD}
.sosbig.alt2{background:#3A0A1F;color:#fff} .sosbig.alt2 .n{color:#E9D3A6;font-size:24px}
.sosbig .x{flex:1;font-size:14.5px;line-height:1.5}

/* ═════ تثبيت ═════ */
.install{border:1px solid var(--line2);border-radius:var(--r2);padding:14px;margin-bottom:12px;background:linear-gradient(135deg,var(--paper2),var(--paper))}
.install h4{margin:0 0 6px;color:var(--ink);font-size:15.5px;display:flex;align-items:center;gap:10px}
.install h4>.i{color:var(--gold)}
.install ol{margin:0;padding-inline-start:22px;color:var(--ink2)}
.install li{margin:6px 0}
.install .row{display:flex;gap:8px;margin-top:10px}
.install .row button{flex:1;min-height:46px;border-radius:12px;background:var(--cta);color:var(--on-cta);font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.install .row button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line2);flex:0 0 52px}

/* ═════ إعدادات القراءة ═════ */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--paper2);border-top:1px solid var(--line2);border-radius:22px 22px 0 0;padding:14px 18px calc(18px + var(--safe-b));box-shadow:var(--sh2);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.7,.2,1)}
.sheet.on{transform:none}
.sheet .grab{width:42px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 12px}
.sheet .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sheet .row:last-child{border:0}
.sheet .lbl{display:flex;align-items:center;gap:10px;font-weight:600}
.sheet .lbl .i{color:var(--gold)}
.opt2{display:flex;border:1px solid var(--line2);border-radius:999px;padding:3px;gap:2px}
.opt2 button{min-height:40px;min-width:48px;padding:0 12px;border-radius:999px;color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:center}
.opt2 button.on{background:var(--cta);color:var(--on-cta)}
.opt2 .i{width:18px;height:18px}
.scrim{position:fixed;inset:0;z-index:44;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:.25s}
.scrim.on{opacity:1;visibility:visible}

/* ═════ الشريط السفلي ═════ */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:25;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + var(--safe-b))}
@supports not (background:color-mix(in srgb,red,blue)){.tabbar{background:var(--bg)}}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;border-radius:14px;font-size:11px;color:var(--dim);font-weight:600;position:relative}
.tabbar button .i{width:23px;height:23px;stroke-width:1.5}
.tabbar button.on{color:var(--rose)}
[data-theme=night] .tabbar button.on{color:var(--gold)}
.tabbar button.on:before{content:"";position:absolute;top:-6px;width:28px;height:3px;border-radius:3px;background:currentColor}
.tabbar button.sos{color:var(--danger)}
.toast{position:fixed;left:50%;top:calc(70px + var(--safe-t));transform:translate(-50%,-10px);z-index:70;background:#2B1720;color:#fff;border:0;border-radius:999px;padding:10px 18px;font-size:14px;opacity:0;visibility:hidden;transition:opacity .2s,transform .2s,visibility .2s;max-width:92%;text-align:center}
.toast.on{opacity:1;visibility:visible;transform:translate(-50%,0)}
@media(min-width:620px){.tiles{grid-template-columns:repeat(3,1fr)}.rgrid{grid-template-columns:repeat(3,1fr)}main{padding-inline:20px}}
@media(max-width:350px){:root{--fs:calc(16px * var(--z))}.bname{font-size:28px}.seg button{padding:0 7px;min-width:36px}}
</style>
</head>
<body>
